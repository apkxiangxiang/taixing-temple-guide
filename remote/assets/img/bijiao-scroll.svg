<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 500" width="1300" height="500">
  <!-- 弼教堂故事長卷：鴉片流入 → 飛鳳山代勸堂迎香火 → 暫奉礱間 → 1906 建弼教堂（插畫示意，神明以神位牌表示） -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ecd6"/><stop offset="1" stop-color="#ecdcbc"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6478"/><stop offset="1" stop-color="#a99fb0"/>
    </linearGradient>
    <pattern id="tile" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#c4553b"/><path d="M0 5.5H6" stroke="#a3402b" stroke-width="1.2"/>
    </pattern>
    <g id="house">
      <rect x="-30" y="0" width="60" height="40" fill="#cdbfa6" stroke="#6b5a48" stroke-width="1.5"/>
      <path d="M-38 2L0 -22L38 2Z" fill="#8f8478" stroke="#5a4e44" stroke-width="1.5"/>
      <rect x="-8" y="16" width="16" height="24" fill="#5a4e44"/>
    </g>
  </defs>
  <style>
    .smoke{animation:smoke 3.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
    .smoke.s2{animation-delay:1.2s}.smoke.s3{animation-delay:2.4s}
    @keyframes smoke{0%{opacity:0;transform:translateY(8px) scale(.7)}30%{opacity:.75}100%{opacity:0;transform:translateY(-26px) scale(1.25)}}
    .dash{animation:dash 3s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
    .flag{animation:flag 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}
    .flag.r{transform-origin:100% 50%}
    @keyframes flag{0%{transform:skewY(-6deg) scaleX(.94)}100%{transform:skewY(5deg) scaleX(1.04)}}
    .sway{animation:sway 2.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
    @keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
    .lantern{animation:lantern 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
    .lantern.b{animation-delay:-1.6s}
    @keyframes lantern{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
    .glow{animation:glow 2.6s ease-in-out infinite alternate}
    @keyframes glow{from{opacity:.15}to{opacity:.5}}
    .bird{animation:bird 28s linear infinite}
    .bird.b2{animation-duration:34s;animation-delay:-12s}
    @keyframes bird{from{transform:translate(-120px,0)}to{transform:translate(1450px,-70px)}}
    .wing{animation:flap .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
    @keyframes flap{to{transform:scaleY(.35)}}
    .drift{animation:drift 9s ease-in-out infinite alternate}
    .drift.slow{animation-duration:14s}
    @keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <rect width="1300" height="500" fill="url(#paper)"/>

  <!-- ========== 第一段：鴉片流入 ========== -->
  <text x="150" y="62" text-anchor="middle" font-family="Noto Serif TC, serif" font-size="22" font-weight="900" fill="#7a1712">清末・鴉片流入</text>
  <path class="drift slow" d="M0 230Q40 160 100 190Q150 120 210 170Q260 140 300 180V250H0Z" fill="url(#haze)" opacity=".75"/>
  <path d="M20 200q30-20 60 0t60 0t60 0t60 0" fill="none" stroke="#e9e4ee" stroke-width="2" opacity=".6"/>
  <rect x="0" y="380" width="300" height="102" fill="#d9cdb4"/>
  <use href="#house" x="70" y="340"/><use href="#house" x="160" y="330"/><use href="#house" x="245" y="342"/>
  <path d="M0 250H300V380H0Z" fill="#a99fb0" opacity=".25"/>

  <!-- ========== 第二段：飛鳳山代勸堂 ========== -->
  <text x="475" y="62" text-anchor="middle" font-family="Noto Serif TC, serif" font-size="22" font-weight="900" fill="#7a1712">新竹芎林・飛鳳山</text>
  <path d="M300 380Q360 260 420 230Q470 150 520 210Q580 250 650 380Z" fill="#5f8f7a"/>
  <path d="M470 160Q455 230 430 300M470 160Q490 220 520 280" fill="none" stroke="#e8f0e4" stroke-width="3" opacity=".6"/>
  <!-- 代勸堂 -->
  <g>
    <rect x="452" y="186" width="40" height="24" fill="#d9c7a3" stroke="#6b4a2c" stroke-width="1.2"/>
    <path d="M444 188L472 172L500 188Z" fill="url(#tile)" stroke="#7a2a1c"/>
    <rect x="466" y="196" width="12" height="14" fill="#7a1712"/>
  </g>
  <text x="472" y="238" text-anchor="middle" font-family="Noto Serif TC, serif" font-size="13" font-weight="900" fill="#fbf5e9">代勸堂</text>
  <rect x="300" y="380" width="350" height="102" fill="#d9cdb4"/>
  <!-- 香火路線 -->
  <path class="dash" d="M480 250Q560 330 690 360Q780 380 900 330" fill="none" stroke="#7a1712" stroke-width="2.5" stroke-dasharray="7 7"/>
  <!-- 香爐 -->
  <g>
    <path d="M590 336H624L618 360H596Z" fill="#c9a24a" stroke="#7a5a1c" stroke-width="1.5"/>
    <path d="M594 336V330M620 336V330" stroke="#7a5a1c" stroke-width="3"/>
    <path d="M601 336V316M607 336V312M613 336V316" stroke="#8a2a1c" stroke-width="2"/>
    <path class="smoke s2" d="M607 308q-6-10 0-18q6-8 0-16" fill="none" stroke="#9a8f80" stroke-width="1.5" opacity=".7"/>
  </g>
  <text x="540" y="415" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="13" font-weight="700" fill="#6d4a2a">迎請關聖帝君香火</text>

  <!-- ========== 第三段：暫奉礱間 ========== -->
  <text x="790" y="62" text-anchor="middle" font-family="Noto Serif TC, serif" font-size="22" font-weight="900" fill="#7a1712">暫奉礱間</text>
  <rect x="650" y="380" width="250" height="102" fill="#d9cdb4"/>
  <path d="M665 220L790 150L915 220Z" fill="#9a8a6a" stroke="#5a4a32" stroke-width="2"/>
  <rect x="680" y="218" width="220" height="162" fill="#e3d4b4" stroke="#6b5a40" stroke-width="2"/>
  <!-- 礱 -->
  <g>
    <rect x="705" y="300" width="70" height="48" rx="6" fill="#a07a52" stroke="#5a3a1e" stroke-width="2"/>
    <rect x="712" y="282" width="56" height="22" rx="4" fill="#b88d60" stroke="#5a3a1e" stroke-width="2"/>
    <path d="M768 292H800" stroke="#5a3a1e" stroke-width="4" stroke-linecap="round"/>
    <path d="M712 318H768M712 332H768" stroke="#5a3a1e" stroke-width="1.5"/>
    <rect x="700" y="348" width="80" height="10" fill="#7a5a3a"/>
  </g>
  <!-- 稻穀袋 -->
  <path d="M812 380q-6-34 10-40q16 6 10 40z" fill="#d8c08a" stroke="#8a6a3a"/>
  <!-- 小供桌 -->
  <rect x="822" y="270" width="64" height="8" fill="#7a4a2a"/>
  <rect x="828" y="278" width="52" height="40" fill="#b8322a"/>
  <path d="M842 270L846 254H862L866 270Z" fill="#c9a24a" stroke="#7a5a1c"/>
  <path d="M850 254V240M854 254V236M858 254V240" stroke="#8a2a1c" stroke-width="2"/>

  <!-- ========== 第四段：弼教堂 ========== -->
  <rect x="900" y="18" width="400" height="464" fill="#f1e0bd"/>
  <text x="1100" y="62" text-anchor="middle" font-family="Noto Serif TC, serif" font-size="22" font-weight="900" fill="#7a1712">弼教堂・1906</text>
  <rect x="915" y="18" width="22" height="464" fill="#a3241b"/>
  <rect x="1263" y="18" width="22" height="464" fill="#a3241b"/>
  <!-- 神龕 -->
  <rect x="950" y="120" width="300" height="230" fill="#7a1712"/>
  <rect x="962" y="132" width="276" height="206" fill="#a3241b" stroke="#e3b54a" stroke-width="3"/>
  <path d="M950 120H1250L1236 100H964Z" fill="#e3b54a"/>
  <!-- 神位後的光 -->
  <ellipse cx="1100" cy="235" rx="125" ry="95" fill="#f6d77a" class="glow"/>
  <!-- 三恩主神位 -->
  <g font-family="Noto Serif TC, serif" font-size="17" font-weight="900" fill="#7a1712" text-anchor="middle" writing-mode="tb" letter-spacing="2">
    <rect x="990" y="170" width="44" height="140" rx="6" fill="#f6e3b0" stroke="#e3b54a" stroke-width="3"/>
    <text x="1012" y="240">孚佑帝君</text>
    <rect x="1078" y="156" width="44" height="154" rx="6" fill="#f6e3b0" stroke="#e3b54a" stroke-width="3"/>
    <text x="1100" y="233">關聖帝君</text>
    <rect x="1166" y="170" width="44" height="140" rx="6" fill="#f6e3b0" stroke="#e3b54a" stroke-width="3"/>
    <text x="1188" y="240">司命真君</text>
  </g>
  <!-- 供桌 -->
  <rect x="960" y="350" width="280" height="14" fill="#7a4a2a"/>
  <rect x="968" y="364" width="264" height="90" fill="#b8322a"/>
  <path d="M968 376H1232M968 442H1232" stroke="#e3b54a" stroke-width="3"/>
  <!-- 燈籠 -->
  <g>
    <ellipse cx="940" cy="110" rx="0" ry="0"/>
    <path d="M985 76V92M1215 76V92" stroke="#5a3a22" stroke-width="2"/>
    <g class="lantern"><path d="M985 76V92" stroke="#5a3a22" stroke-width="2"/><ellipse cx="985" cy="106" rx="14" ry="16" fill="#e0443a" stroke="#7a1712"/></g>
    <g class="lantern b"><path d="M1215 76V92" stroke="#5a3a22" stroke-width="2"/><ellipse cx="1215" cy="106" rx="14" ry="16" fill="#e0443a" stroke="#7a1712"/></g>
  </g>

  <text x="1290" y="476" text-anchor="end" font-family="Noto Sans TC, sans-serif" font-size="11" fill="#6d5c4f" opacity=".8">插畫示意</text>

  <!-- ===== 動態細節 ===== -->
  <!-- 香火一路從飛鳳山迎回來（光點沿路線走） -->
  <g>
    <circle r="7" fill="#f6d77a" opacity=".55"><animateMotion dur="7s" repeatCount="indefinite" path="M480 250Q560 330 690 360Q780 380 900 330"/></circle>
    <circle r="3.5" fill="#fff3c4"><animateMotion dur="7s" repeatCount="indefinite" path="M480 250Q560 330 690 360Q780 380 900 330"/></circle>
  </g>
  <path class="smoke s1" d="M854 236q-6-8 0-15q6-7 0-14" fill="none" stroke="#9a8f80" stroke-width="2" stroke-linecap="round" opacity="0"/><path class="smoke s2" d="M854 236q-6-8 0-15q6-7 0-14" fill="none" stroke="#9a8f80" stroke-width="2" stroke-linecap="round" opacity="0"/><path class="smoke s3" d="M854 236q-6-8 0-15q6-7 0-14" fill="none" stroke="#9a8f80" stroke-width="2" stroke-linecap="round" opacity="0"/>
  <!-- 神位後的光、燭火 -->
  <g><rect x="975" y="330" width="6" height="18" fill="#f6e3b0"/><ellipse cx="978" cy="326" rx="3" ry="5" fill="#f6b23a" class="glow"/>
     <rect x="1219" y="330" width="6" height="18" fill="#f6e3b0"/><ellipse cx="1222" cy="326" rx="3" ry="5" fill="#f6b23a" class="glow"/></g>
  <!-- 鴉片的煙霧在庄頭飄 -->
  <g class="drift" opacity=".5"><path d="M10 300q40-18 80 0t80 0t80 0" fill="none" stroke="#c9c0d2" stroke-width="6" stroke-linecap="round"/></g>
  <g class="drift slow" opacity=".4"><path d="M40 270q35-14 70 0t70 0t70 0" fill="none" stroke="#d9d2e0" stroke-width="5" stroke-linecap="round"/></g>
  <!-- 飛鳳山上的樹 -->
  <g fill="#4f7a64"><circle cx="400" cy="300" r="12"/><circle cx="560" cy="300" r="14"/><circle cx="520" cy="330" r="10"/><circle cx="430" cy="340" r="11"/></g>

  <rect x="0" y="0" width="1300" height="14" fill="#7a1712"/>
  <rect x="0" y="486" width="1300" height="14" fill="#7a1712"/>
  <rect x="0" y="14" width="1300" height="4" fill="#e3b54a"/>
  <rect x="0" y="482" width="1300" height="4" fill="#e3b54a"/>
</svg>
